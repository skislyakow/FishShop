[project]
name = "fishshop-bot"
version = "0.1.0"
description = "Telegram-бот FishShop — тонкий клиент над REST API Strapi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "python-telegram-bot>=22.8",
    "redis>=8.1",
]

# Не пакет, а приложение: uv не собирает wheel, просто ставит зависимости в .venv.
[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
# IDE-расширение mypy запускается в своём окружении и не видит .venv проекта,
# из-за чего падает на импорте redis. Настоящая проверка идёт через
# `uv run --with mypy mypy .`, где зависимость есть.
[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

# Ширина 88 — дефолт ruff. Фиксируем явно, чтобы автоформат IDE
# не расходился с `uv run ruff format`.
[tool.ruff]
line-length = 88
